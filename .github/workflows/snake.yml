name: Generate contribution snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/snake.yml

concurrency:
  group: contribution-snake
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Report contribution count
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || github.token }}
          PROFILE_USER: ${{ github.repository_owner }}
        run: |
          gh api graphql \
            -f query='query($login: String!) { user(login: $login) { contributionsCollection { contributionCalendar { totalContributions } restrictedContributionsCount } } }' \
            -f login="$PROFILE_USER" \
            --jq '.data.user.contributionsCollection | "Contributions fetched: \(.contributionCalendar.totalContributions)\nRestricted contributions: \(.restrictedContributionsCount)"' \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Generate light and dark snake animations
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          github_token: ${{ secrets.GH_PAT || github.token }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
      - name: Publish animations to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
